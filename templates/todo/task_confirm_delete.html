{% extends "base.html" %}

{% block content %}
<h1>Delete task?</h1>

<div class="d-flex gap-2">
  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes" class="btn btn-danger">
  </form>

  <a href="{% url 'todo:task_list' %}" class="btn btn-primary">
    No, Keep It
  </a>
</div>

{% endblock %}
